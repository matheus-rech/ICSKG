# ICSKG-BR Database — Fetch & Verify (manual trigger)
# =====================================================
# Phase 11 reproducibility refactor: this workflow no longer rebuilds the
# database from raw DATASUS sources (which is impossible on github-hosted
# runners since data_sources/processed/ is gitignored and the raw archive
# is 100+ GB on the user's NAS). Instead it FETCHES the canonical pre-built
# database from a versioned HuggingFace Dataset, verifies its integrity
# (manifest SHA256s + row count invariant), materializes a SQLite, and
# uploads it as a workflow artifact.
#
# The actual local build pipeline (assemble_panel → impute_ifgf → build_database)
# still lives in `database/build_database_v3.py` and is exercised on every
# push/PR by `build-database-smoke.yml` against the committed fixture.
#
# Security: ALL workflow inputs flow through `env:` blocks before being
# referenced in `run:` scripts. This prevents shell injection from any
# user-controlled value (workflow inputs, ref names, etc.). See
# https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/

name: Build Database

on:
  workflow_dispatch:
    inputs:
      hf_revision:
        description: "HuggingFace dataset revision to fetch (e.g., v0.1.0 or main)"
        required: false
        default: "v0.1.0"
        type: string
      hf_repo_id:
        description: "HuggingFace dataset repo id"
        required: false
        default: "matheus-rech/icskg-br-processed"
        type: string
      expected_rows:
        description: "Expected row count for panel/municipal_health.parquet"
        required: false
        default: "50130"
        type: string
      run_tests:
        description: "Run pytest before fetching"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# Avoid concurrent fetches of the same revision
concurrency:
  group: build-database-${{ inputs.hf_revision }}
  cancel-in-progress: false

jobs:
  fetch-and-verify:
    name: Fetch ICSKG-BR Database from HF
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install dependency-groups
          pip-install-dependency-groups dev

      - name: Run unit tests
        if: ${{ inputs.run_tests }}
        run: python -m pytest tests/ -v --tb=short

      - name: Restore HuggingFace dataset cache
        id: hf-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-icskg-br-processed-${{ inputs.hf_revision }}-${{ runner.os }}
          restore-keys: |
            hf-icskg-br-processed-${{ inputs.hf_revision }}-
            hf-icskg-br-processed-

      - name: Validate inputs
        env:
          HF_REVISION: ${{ inputs.hf_revision }}
          EXPECTED_ROWS: ${{ inputs.expected_rows }}
        run: |
          if [ -z "$HF_REVISION" ]; then
            echo "Empty hf_revision input" >&2
            exit 1
          fi
          if ! echo "$EXPECTED_ROWS" | grep -Eq '^[0-9]+$'; then
            echo "Invalid expected_rows: $EXPECTED_ROWS" >&2
            exit 1
          fi
          echo "Will fetch revision $HF_REVISION (expecting $EXPECTED_ROWS panel rows)"

      - name: Fetch processed dataset from HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REVISION: ${{ inputs.hf_revision }}
          HF_REPO_ID: ${{ inputs.hf_repo_id }}
          EXPECTED_ROWS: ${{ inputs.expected_rows }}
        run: |
          mkdir -p database
          python -m database.fetch_processed_data \
            --repo-id "$HF_REPO_ID" \
            --revision "$HF_REVISION" \
            --target-dir "$HOME/.cache/icskg/hf-snapshots/$HF_REVISION" \
            --to database/icskg_br.sqlite \
            --expected-rows "$EXPECTED_ROWS"

      - name: Verify materialized SQLite
        env:
          EXPECTED_ROWS: ${{ inputs.expected_rows }}
        run: |
          if [ ! -f database/icskg_br.sqlite ]; then
            echo "Missing icskg_br.sqlite" >&2
            exit 1
          fi
          # EXPECTED_ROWS comes from env (validated above), not direct interpolation,
          # so the inline Python script is shell-injection-safe.
          python <<'PYCHECK'
          import os
          import sqlite3
          expected = int(os.environ["EXPECTED_ROWS"])
          conn = sqlite3.connect("database/icskg_br.sqlite")
          n = conn.execute("SELECT COUNT(*) FROM municipal_health").fetchone()[0]
          print(f"municipal_health rows: {n}")
          assert n == expected, f"Expected {expected} rows, got {n}"
          tables = [
              r[0]
              for r in conn.execute(
                  "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"
              ).fetchall()
          ]
          print(f"Tables ({len(tables)}): {tables}")
          assert "municipal_health" in tables, "Missing municipal_health table"
          conn.close()
          PYCHECK

      - name: Upload database artifact
        uses: actions/upload-artifact@v5
        with:
          name: icskg-br-database-${{ inputs.hf_revision }}
          path: database/icskg_br.sqlite
          retention-days: 30
          if-no-files-found: error
