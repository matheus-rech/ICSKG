# ICSKG-BR Database Build — Manual Trigger
# ===========================================
# Runs the Phase 4 pipeline: assemble panel → impute IFGF → persist SQLite.
# Triggered manually via the GitHub Actions "Run workflow" button.

name: Build Database

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "Start year (inclusive)"
        required: false
        default: "2015"
        type: string
      end_year:
        description: "End year (inclusive)"
        required: false
        default: "2023"
        type: string
      builder_version:
        description: "Database builder version"
        required: false
        default: "v3"
        type: choice
        options:
          - v3
          - v2
      run_tests:
        description: "Run pytest before building"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build ICSKG-BR Database (${{ inputs.builder_version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        if: ${{ inputs.run_tests }}
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Build database (v3)
        if: ${{ inputs.builder_version == 'v3' }}
        run: |
          python -m database.build_database_v3 \
            --processed-dir data_sources/processed \
            --db-dir database \
            --years ${{ inputs.start_year }} ${{ inputs.end_year }}

      - name: Build database (v2)
        if: ${{ inputs.builder_version == 'v2' }}
        run: |
          python -m database.build_database_v2 \
            --processed-dir data_sources/processed \
            --db-dir database \
            --years ${{ inputs.start_year }} ${{ inputs.end_year }}

      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        with:
          name: icskg-br-database-${{ inputs.builder_version }}
          path: |
            database/icskg_br.sqlite
            database/icskg_br.duckdb
            database/database_metadata.json
          retention-days: 30
          if-no-files-found: error
