# ICSKG-BR Data Path Configuration
# Copy this file to config.yaml and adjust paths for your machine.
# If config.yaml is absent, pipeline.py defaults to data_sources/ (relative to project root).

# NAS or local data root. Set to your NAS mount path, e.g.:
#   smb://synology-rech._smb._tcp.local/docker/Downloads
# Or a local path such as /Volumes/NAS/Downloads or /mnt/nas/downloads
data_root: "data_sources"

# Subdirectories under data_root (relative paths from data_root)
raw_dir: "raw"
processed_dir: "processed"
quarantine_dir: "quarantine"

# Database output directory (relative to project root)
db_dir: "database"

# Output directory for analysis figures and tables
output_dir: "analysis/results"

# HuggingFace Dataset configuration (Phase 11 — canonical processed-data store)
# CI and replicators fetch processed data from here instead of NAS.
# The HF_TOKEN env var is read at runtime (huggingface-cli login OR
# `export HF_TOKEN=...`). For private datasets, a read-scoped token suffices.
huggingface:
  dataset_repo: "mmrech/icskg-br-processed"
  dataset_revision: "v0.1.0"
  token_env_var: "HF_TOKEN"
