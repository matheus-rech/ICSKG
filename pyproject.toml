[project]
name = "icskg-br"
version = "1.0.0"
description = "Municipal Urban Development and Global Surgery Panel Study — Brazil"
requires-python = ">=3.12,<3.14"
dependencies = [
    # Core data processing
    "pandas>=2.2.3,<3.0",
    "numpy>=2.0",
    "pyarrow>=19.0",
    # DATASUS / health data acquisition
    "pysus>=1.0.1",
    "datasus-fetcher>=0.4.1",
    "requests>=2.32",
    # Brazilian government APIs
    "sidrapy>=0.1.4",
    "ipeadatapy>=0.1.9",
    # Database layer
    "duckdb>=1.5.1",
    # Statistical computing
    "scipy>=1.13",
    # Machine learning
    "scikit-learn>=1.6,<2.0",
    "xgboost>=2.1,<4.0",
    "linearmodels>=7.0",
    "econml>=0.15",
    "shap>=0.46,<1.0",
    "numba>=0.60",
    "llvmlite>=0.43",
    # Visualization
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "SciencePlots>=2.1",
    # Geospatial
    "geopandas>=1.1",
    "libpysal>=4.12",
    "esda>=2.6",
    "geobr>=0.2",
    "mapclassify>=2.8",
    # Supporting utilities
    "openpyxl>=3.1",
    "tqdm>=4.64",
    "python-dotenv>=1.0",
    # Configuration
    "pyyaml>=6.0",
    # HuggingFace Datasets — canonical processed-data store (Phase 11)
    "huggingface_hub>=0.26",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["database", "scripts", "analysis"]
